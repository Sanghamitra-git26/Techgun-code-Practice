<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed video</title>
</head>
<body>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/3Rdy4cWwyL8?si=B07h8rNs9zqIzV5z" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen ></iframe>
    <!-- embed -->
    <embed src="Frontend development roadmap.pdf" type="pdf">

        <!-- IFRAME -->
        <iframe src="Frontend development roadmap.pdf" frameborder="0"></iframe>

        <!-- OBJECT -->
        <object data="Frontend development roadmap.pdf" type="application/pdf"></object>
</body>
</html>
