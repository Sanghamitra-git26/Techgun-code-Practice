    <title>Ordered list</title>
</head>
<body>
    <!-- ORDERED LIST -->

        <ol type="a">
        <li>tea</li>
        <li>coffee</li>
        <li>milk</li>
        <li>colddrinks</li>

    <ol type="A">
        <li>tea</li>
        <li>coffee
            <ol>
                <li>black coffee</li>
                <li>filter coffee</li>
                <li>mocha coffee</li>
                <li>capeccino</li>
            </ol>
        <li>milk</li>
        <li>colddrinks</li>
    </ol>
</body>
